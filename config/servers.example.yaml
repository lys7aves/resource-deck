app:
  bind: 127.0.0.1
  port: 8765
polling:
  system_seconds: 3
  gpu_seconds: 3
  users_seconds: 5
  docker_seconds: 10
  command_timeout_seconds: 5
providers:
  codex:
    enabled: false
    executable: /absolute/path/to/codex
    poll_seconds: 60
    reconnect_seconds: 15
    timeout_seconds: 15
servers:
  - id: server-a
    enabled: true
    display_name: Server A
    ssh_host: server.example
    ssh_user: monitor-user
    ssh_known_hosts: ~/.ssh/known_hosts
    tracked_users: [monitor-user]
    collectors:
      gpu: auto
      docker: auto
    owner_hints:
      compose_projects:
        project-a: monitor-user
      home_prefixes:
        /home/monitor-user: monitor-user
